[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mas"
version = "0.1.0"
description = "Paired simulations of LLM-based and deterministic components in adaptive normative multi-agent systems (Studies 1-3)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marx Viana" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
llm-mas = "llm_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
